name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - if: matrix.python-version == '3.12'
        run: python -m pip install -e '.[kooplearn]'
      - if: matrix.python-version == '3.12'
        uses: actions/checkout@v4
        with:
          repository: MinchanJeong/NeuralKoopmanSVD
          ref: d76194d5b7e62d973edb2a226f2a54f4662b48cb
          path: .upstream/pendulum
          persist-credentials: false
      - if: matrix.python-version == '3.12'
        run: python -m pip install 'lightning==2.6.6' 'torchmetrics==1.9.0' scipy
      - if: matrix.python-version == '3.12'
        run: KOOPMAN_UPSTREAM="$GITHUB_WORKSPACE/.upstream/pendulum" python -m pytest -q
      - if: matrix.python-version == '3.10'
        run: python -m pytest -q
      - run: koopman-svd-benchmark --quick --seeds 0 --output runs/ci
