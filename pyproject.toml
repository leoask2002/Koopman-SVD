[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koopman-neuralsvd"
version = "0.2.0"
description = "Paired-data neural singular-function learning for Koopman operators"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
plots = ["matplotlib>=3.8,<4"]
kooplearn = ["kooplearn>=2,<3"]

[project.scripts]
koopman-svd-benchmark = "koopman_svd.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
